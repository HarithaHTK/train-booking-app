services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: train_booking_app
      MYSQL_USER: train_booking_user
      MYSQL_PASSWORD: train_booking_password
      MYSQL_ROOT_PASSWORD: train_booking_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ptrain_booking_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8000:8000'
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173,http://localhost:5174
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: train_booking_app
      DB_USERNAME: train_booking_user
      DB_PASSWORD: train_booking_password
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      - backend
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./portal:/app
      - frontend_node_modules:/app/node_modules

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      - backend
    ports:
      - '5174:5174'
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
  admin_node_modules: